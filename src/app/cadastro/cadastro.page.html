<!-- cadastro.page.html -->
<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Cadastro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" fullscreen>
  <div class="cadastro-container">

    <div class="header-section">
      <ion-icon name="person-circle-outline" class="header-icon"></ion-icon>
      <h1>Crie sua Conta</h1>
      <p>É rápido e fácil!</p>
    </div>

    <form [formGroup]="cadastroForm" (ngSubmit)="cadastrar()" class="cadastro-form">

      <ion-item class="input-item">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-input formControlName="name" type="text" placeholder="Seu nome completo"></ion-input>
      </ion-item>

      <ion-item class="input-item">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-input formControlName="email" type="email" placeholder="Seu e-mail"></ion-input>
      </ion-item>

      <ion-item class="input-item">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input formControlName="password" type="password" placeholder="Crie uma senha"></ion-input>
      </ion-item>

      <ion-item class="input-item">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input formControlName="confirmPassword" type="password" placeholder="Confirme sua senha"></ion-input>
      </ion-item>

      <ion-button id="cadastro-button" type="submit" expand="block" shape="round">
  Cadastrar
</ion-button>


    </form>
  </div>
</ion-content>
