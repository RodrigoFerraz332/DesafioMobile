<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button default-href="#" (click)="voltar()"></ion-back-button>
    </ion-buttons>
    <ion-title>Recuperar Acesso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="redefinir-senha-container">
    <div class="texto-autenticador-cabeçalho">
      <h1>Esqueceu sua senha?</h1>
      <p>Para redefinir a sua senha, insira seu e-mail cadastrado.</p>
    </div>

    <!-- Formulário de Email -->
    <form [formGroup]="emailForm" (ngSubmit)="verificarEmail()" class="redefinir-senha-form">
      <ion-item class="input-item">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-input formControlName="email" type="email" placeholder="Seu e-mail"></ion-input>
      </ion-item>
      <div class="conteiner-botoes">
        <ion-button type="submit" [disabled]="emailForm.invalid" class="redefinir-senha-button" expand="block" shape="round">
          Enviar
          <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>

<!-- MODAL PARA REDEFINIR A SENHA -->
<ion-modal [isOpen]="isModalOpen" (didDismiss)="abrirModal(false)" backdrop-dismiss="false">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Crie uma nova senha</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="abrirModal(false)">Cancelar</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <form [formGroup]="senhaForm" (ngSubmit)="redefinirSenha()">
        <p>A nova senha deve ter no mínimo 6 caracteres.</p>
        <ion-item class="input-item">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input formControlName="novaSenha" type="password" placeholder="Nova senha"></ion-input>
        </ion-item>
        <ion-item class="input-item">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input formControlName="confirmarSenha" type="password" placeholder="Confirme a nova senha"></ion-input>
        </ion-item>
        <ion-button type="submit" [disabled]="senhaForm.invalid" class="ion-margin-top" expand="block" shape="round">
          Redefinir Senha
        </ion-button>
      </form>
    </ion-content>
  </ng-template>
</ion-modal>
